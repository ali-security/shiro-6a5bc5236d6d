name: Maven CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional surefire -Dtest selector; empty runs the full suite'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.1

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: 8
          distribution: temurin
          cache: maven

      - name: Build with Maven
        shell: bash
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            mvn verify --errors --batch-mode --no-transfer-progress -Pdocs -Drat.skip=true "-Dtest=${{ inputs.test-filter }}" -DskipITs -Dsurefire.failIfNoSpecifiedTests=false
          else
            mvn verify --errors --batch-mode --no-transfer-progress -Pdocs -Drat.skip=true
          fi

      - name: Test summary
        if: success() || failure()
        shell: bash
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} .github/seal-test-summary.py .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shiro-core-jars
          path: |
            core/target/shiro-core-1.13.0.jar
            core/target/shiro-core-1.13.0-jakarta.jar
            core/target/shiro-core-1.13.0-tests.jar
          if-no-files-found: error

  build-linux:
    needs: build

    strategy:
      matrix:
        os: [ ubuntu-latest ]
        java:
          #  8
          - version: 8
            dist: adopt-openj9
          # 11
          - version: 11
            dist: temurin
          - version: 11
            dist: adopt-openj9
          # 17
          - version: 17
            dist: temurin
          - version: 17
            dist: adopt-openj9
          - version: 17
            dist: zulu
      fail-fast: false

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.1

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: ${{ matrix.java.version }}
          distribution: ${{ matrix.java.dist }}
          cache: maven

      - name: Build with Maven
        shell: bash
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            mvn verify --errors --batch-mode --no-transfer-progress -Pdocs -Drat.skip=true "-Dtest=${{ inputs.test-filter }}" -DskipITs -Dsurefire.failIfNoSpecifiedTests=false
          else
            mvn verify --errors --batch-mode --no-transfer-progress -Pdocs -Drat.skip=true
          fi

      - name: Test summary
        if: success() || failure()
        shell: bash
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} .github/seal-test-summary.py .

  build-mac-win:
    needs: build

    strategy:
      matrix:
        os: [ windows-2022, macOS-latest ]
        java:
          #  8
          - version: 8
            dist: temurin
          # 17
          - version: 17
            dist: temurin
      fail-fast: false

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.1

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: ${{ matrix.java.version }}
          distribution: ${{ matrix.java.dist }}
          architecture: ${{ (runner.os == 'macOS' && matrix.java.version == 8) && 'x64' || '' }}
          cache: maven

      - name: Build with Maven
        shell: bash
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            mvn verify --errors --batch-mode --no-transfer-progress -Pdocs -Drat.skip=true "-Dtest=${{ inputs.test-filter }}" -DskipITs -Dsurefire.failIfNoSpecifiedTests=false
          else
            mvn verify --errors --batch-mode --no-transfer-progress -Pdocs -Drat.skip=true
          fi

      - name: Test summary
        if: success() || failure()
        shell: bash
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} .github/seal-test-summary.py .
